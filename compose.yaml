name: plant

services:
  app:
    image: ghcr.io/lekko8/plant:latest
    restart: unless-stopped
    build: .
    environment:
      HTTP_ADDR: ":8088"
    # Классическая схема: A-запись домена -> белый IP, оранжевое облако Cloudflare.
    # Cloudflare проксирует только 80/8080/8880/2052/2082/2086/2095 (HTTP),
    # 8088 в этом списке нет — поэтому наружу публикуем 80,
    # а внутри контейнера приложение по-прежнему слушает 8088.
    ports:
      - "80:8088"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Cloudflare Tunnel запускается отдельным systemd-сервисом на хосте
  # (см. README/инструкцию): cloudflared -> http://localhost:8088.
  # В compose он не нужен, чтобы токен туннеля не проходил через CI.

