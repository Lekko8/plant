name: plant

services:
  app:
    image: ghcr.io/lekko8/plant:latest
    restart: unless-stopped
    build: .
    environment:
      HTTP_ADDR: ":8088"
      # Cloudflare в режиме Full ходит на origin по HTTPS (443),
      # поэтому приложение дополнительно слушает TLS на :8443.
      HTTPS_ADDR: ":8443"
      TLS_CERT_FILE: /certs/cert.pem
      TLS_KEY_FILE: /certs/key.pem
    # Наружу смотрим через Cloudflare: 80 -> :8088 (HTTP), 443 -> :8443 (HTTPS).
    ports:
      - "80:8088"
      - "443:8443"
    volumes:
      # Самоподписанный сертификат готовится на хосте (см. README).
      # Cloudflare в режиме Full принимает self-signed.
      - /home/dev/certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

