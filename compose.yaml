name: plant

services:
  app:
    image: ghcr.io/lekko8/plant:latest
    restart: unless-stopped
    build: .
    environment:
      HTTP_ADDR: ":8088"
    # Прямая публикация через белый IPv4 + проброс порта на роутере.
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Вариант без открытых портов: Cloudflare Tunnel.
  # Тогда уберите ports у app и используйте service: http://app:8088 в настройках туннеля.
  #
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
  #   depends_on:
  #     - app
