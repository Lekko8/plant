name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Ветка dev — рабочая: сюда идут все изменения, CI гоняет тесты и проверяет
# сборку образа, но ничего не публикует и не деплоит.
# Ветка main — релизная: только сюда мержится dev, и только отсюда
# собирается образ в GHCR и обновляется homelab.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Эти файлы не отформатированы (gofmt):"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -shuffle=on -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  build:
    name: Build image
    needs: test
    # Собираем образ везде, чтобы сломанный Dockerfile ловился до мержа в main.
    # Публикуем в GHCR только из main.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # поменяйте на linux/arm64, если homelab на ARM
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to homelab
    needs: build
    if: github.ref == 'refs/heads/main'
    # Self-hosted runner внутри homelab: сам ходит в GitHub наружу,
    # поэтому IPv6/NAT/динамический IP на входящие соединения не влияют.
    runs-on: [self-hosted, linux, plant]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image and restart
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
